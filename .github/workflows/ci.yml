name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Lint
        run: npm run lint
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app

  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r etl/requirements.txt

      - name: Byte-compile ETL scripts
        run: python -m compileall -q etl

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Create Supabase roles
        # Plain postgres doesn't have Supabase's anon/authenticated roles
        # that every migration's `grant ... to anon, authenticated` targets
        # -- create stand-ins so the grants (and the RLS policies in
        # 0001_core_schema.sql that reference them) succeed the same way
        # they do against a real Supabase project.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated;"

      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::$f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
